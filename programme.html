<title>La grille des programmes · L'Escale du Soir</title>
<meta name="description" content="La grille des programmes de L'Escale du Soir, jour par jour. Musique en continu et libre antenne du lundi au jeudi de 22h à 23h.">

<style>
  :root {
    --nuit: #0d1220; --nuit-2: #151c30;
    --carte: rgba(255,255,255,0.04); --bord: rgba(255,255,255,0.09);
    --texte: #ece7dd; --doux: #a9a6a0; --phare: #f2b45a;
    --police: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    --affiche: "Anton", "Impact", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--nuit); color: var(--texte); font-family: var(--police); -webkit-font-smoothing: antialiased; line-height: 1.6; overflow-x: hidden; }
  .ciel { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, #0a0f1c 0%, var(--nuit) 50%, var(--nuit-2) 100%); }
  .ciel span { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .5; animation: scintille 4s infinite ease-in-out; }
  @keyframes scintille { 50% { opacity: .1; } }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }

  .barre { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; }
  .marque { font-family: "Cinzel", Georgia, serif; font-weight: 600; color: var(--phare); text-decoration: none; letter-spacing: .03em; font-size: 1.05rem; white-space: nowrap; }
  .pilule {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 999px; text-decoration: none;
    border: 1px solid rgba(242,180,90,.55); color: var(--phare); font-weight: 600; font-size: .9rem; white-space: nowrap;
    background: rgba(13,18,32,.65); transition: background .15s, color .15s;
  }
  .pilule:hover { background: var(--phare); color: var(--nuit); }
  .rec { width: 8px; height: 8px; border-radius: 50%; background: #e8574a; box-shadow: 0 0 8px #e8574a; animation: rec 1.6s ease-in-out infinite; }
  @keyframes rec { 50% { opacity: .35; } }

  .entete { text-align: center; padding: 34px 0 26px; }
  .sur-titre { letter-spacing: .4em; text-transform: uppercase; font-size: .75rem; color: var(--phare); padding-left: .4em; }
  h1 {
    font-family: var(--affiche); font-weight: 400; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(2.4rem, 8vw, 4.2rem); line-height: 1.05; margin: 10px 0 12px;
    background: linear-gradient(180deg, #fff3d1 0%, #f6cf86 30%, #d99a45 55%, #f3c77a 80%, #fff0c4 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--phare);
  }
  .entete p { color: var(--doux); max-width: 560px; margin: 0 auto; }

  /* En ce moment */
  .maintenant { margin: 10px 0 30px; }
  .maintenant .etiquette { display: flex; align-items: center; gap: 8px; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--doux); margin-bottom: 10px; }

  /* Jours */
  .jours { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 14px; scrollbar-width: none; }
  .jours::-webkit-scrollbar { display: none; }
  .jour {
    flex: 1 0 auto; min-width: 74px; padding: 10px 14px; border-radius: 14px; cursor: pointer;
    border: 1px solid var(--bord); background: var(--carte); color: var(--doux);
    font: 600 .92rem var(--police); transition: all .15s;
  }
  .jour small { display: block; font-weight: 500; font-size: .7rem; opacity: .7; }
  .jour:hover { color: var(--texte); border-color: rgba(242,180,90,.4); }
  .jour.actif { background: var(--phare); border-color: var(--phare); color: var(--nuit); }

  /* Emissions */
  .liste { display: grid; gap: 12px; padding-bottom: 60px; }
  .emission {
    --c1: #f2b45a; --c2: #ffe1a6; --fond: #2a1a08;
    position: relative; display: grid; grid-template-columns: 112px 1fr auto; align-items: center; gap: 18px;
    width: 100%; text-align: left; cursor: pointer; overflow: hidden;
    padding: 18px 22px; border-radius: 18px; border: 1px solid var(--bord);
    background: linear-gradient(90deg, color-mix(in srgb, var(--fond) 55%, transparent), rgba(255,255,255,.02) 70%);
    color: var(--texte); font-family: var(--police);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s;
  }
  .emission::before {
    content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .3s;
    background: radial-gradient(circle at 15% 50%, color-mix(in srgb, var(--c1) 35%, transparent), transparent 60%), var(--fond);
    z-index: 0;
  }
  .emission::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, var(--c1), var(--c2)); }
  .emission > * { position: relative; z-index: 1; }
  .emission:hover, .emission:focus-visible {
    transform: translateY(-3px) scale(1.01); border-color: color-mix(in srgb, var(--c1) 60%, transparent);
    box-shadow: 0 18px 40px -12px color-mix(in srgb, var(--c1) 55%, transparent); outline: none;
  }
  .emission:hover::before, .emission:focus-visible::before { opacity: 1; }
  .heure { font-weight: 700; font-size: 1rem; color: var(--texte); font-variant-numeric: tabular-nums; }
  .heure span { display: block; font-weight: 500; font-size: .8rem; color: var(--doux); }
  .titre {
    font-family: var(--affiche); font-weight: 400; letter-spacing: .01em;
    font-size: clamp(1.6rem, 4.4vw, 2.5rem); line-height: 1;
    background: linear-gradient(100deg, var(--c1) 0%, var(--c2) 50%, var(--c1) 100%); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--c1);
    transition: background-position .6s ease, letter-spacing .3s ease;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.35));
  }
  .emission:hover .titre { background-position: 100% 0; letter-spacing: .04em; }
  .info { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .picto {
    flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c1) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c1) 45%, transparent); color: var(--c1);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), background .25s, color .25s;
  }
  .picto svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .emission:hover .picto { transform: rotate(-8deg) scale(1.1); background: var(--c1); color: var(--fond); }
  .fiche .picto { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 16px; }
  .fiche .picto svg { width: 34px; height: 34px; }
  .epoque { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .epoque span { padding: 6px 12px; border-radius: 10px; background: color-mix(in srgb, var(--c1) 12%, rgba(255,255,255,.03)); color: var(--texte); font-size: .88rem; font-weight: 500; }
  .accroche { display: block; margin-top: 6px; color: var(--doux); font-size: .92rem; }
  .emission:hover .accroche { color: var(--texte); }
  .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .badge {
    font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
    padding: 4px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--c1) 55%, transparent); color: var(--c1);
  }
  .plus { font-size: .8rem; color: var(--doux); transition: color .2s; }
  .emission:hover .plus { color: var(--c1); }
  .emission.en-cours { border-color: color-mix(in srgb, var(--c1) 70%, transparent); }

  /* Fiche */
  .voile { position: fixed; inset: 0; z-index: 40; background: rgba(5,8,16,.75); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .fiche {
    --c1: #f2b45a; --c2: #ffe1a6; --fond: #2a1a08;
    position: fixed; z-index: 41; left: 50%; top: 50%; width: min(560px, 92vw); max-height: 88vh; overflow: auto;
    transform: translate(-50%, -46%) scale(.98); opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
    border-radius: 26px; border: 1px solid color-mix(in srgb, var(--c1) 45%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--fond) 80%, #0d1220), #0f1526 70%);
    box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 80px -30px var(--c1);
  }
  body.fiche-ouverte .voile, body.fiche-ouverte .fiche { opacity: 1; pointer-events: auto; }
  body.fiche-ouverte .fiche { transform: translate(-50%, -50%) scale(1); }
  .fiche .haut { padding: 36px 28px 26px; background: radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--c1) 30%, transparent), transparent 65%); }
  .fiche .titre { font-size: clamp(2.2rem, 8vw, 3.4rem); }
  .fiche .slogan { margin-top: 10px; font-weight: 600; color: var(--texte); }
  .fiche .corps { padding: 0 28px 28px; }
  .fiche .corps p { color: #cfcac1; margin-bottom: 18px; }
  .fiche h3 { font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--doux); margin-bottom: 8px; font-weight: 600; }
  .creneaux { list-style: none; display: grid; gap: 6px; margin-bottom: 18px; }
  .creneaux li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.04); font-size: .92rem; }
  .creneaux li b { font-weight: 600; }
  .genres { display: flex; flex-wrap: wrap; gap: 6px; }
  .fermer {
    position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 50%; z-index: 2;
    border: 1px solid var(--bord); background: rgba(13,18,32,.6); color: var(--doux); font-size: 1.4rem; line-height: 1; cursor: pointer;
  }
  .fermer:hover { color: var(--c1); border-color: var(--c1); }

  footer { border-top: 1px solid var(--bord); padding: 30px 0 40px; text-align: center; color: var(--doux); font-size: .85rem; }
  footer a { color: var(--phare); text-decoration: none; }

  @media (max-width: 640px) {
    .emission { grid-template-columns: 1fr auto; gap: 10px 14px; padding: 16px 18px; }
    .heure { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; }
    .heure span { display: inline; }
    .badges { grid-row: 2; grid-column: 2; }
    .picto { width: 44px; height: 44px; border-radius: 13px; }
    .picto svg { width: 24px; height: 24px; }
    .info { gap: 12px; }
    .marque { font-size: .9rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<div class="wrap">

    radio7080:   { titre: "70s 80s Radio",       picto: "disco",    c1: "#ff7a45", c2: "#ffd0bd", fond: "#4a1c0c", slogan: "Paillettes, synthés et brushings audacieux.", texte: "Les tubes pop des années 70 et 80, du disco aux synthés. Des chansons que tout le monde connaît, même ceux qui n'étaient pas nés.", genres: ["Disco", "Pop", "Années 70 et 80"], artistes: ["ABBA", "Michael Jackson", "Madonna", "Bee Gees", "Cyndi Lauper"] },
    radio90:     { titre: "90's Radio",          picto: "cassette", c1: "#7c83ff", c2: "#d9dbff", fond: "#1a1d5a", slogan: "La décennie qui ne vieillit pas.", texte: "Les hits pop des années 90, ceux des boums, des cassettes et des premières radios libres. De la bonne humeur, sans modération.", genres: ["Pop", "Années 90"], artistes: ["Spice Girls", "Backstreet Boys", "Céline Dion", "Whitney Houston", "Ace of Base"] },
    radio2000:   { titre: "2000's Radio",        picto: "baladeur", c1: "#2ee6a6", c2: "#c4ffe9", fond: "#083a2a", slogan: "Les années 2000 en version best of.", texte: "Les grands tubes pop des années 2000, à écouter fort. Idéal pour la soirée, quand il reste encore un peu d'énergie à dépenser.", genres: ["Pop", "Années 2000"], artistes: ["Rihanna", "Black Eyed Peas", "Lady Gaga", "Coldplay", "Kylie Minogue"] },
    mix1990:     { titre: "1990s Mix",           picto: "vinyle",   c1: "#c8f031", c2: "#efffc0", fond: "#34420a", slogan: "Un grand mix des années 90.", texte: "Eurodance, pop, R&B et grands classiques des années 90 dans un mix sans temps mort. Pour finir la soirée en beauté.", genres: ["Eurodance", "Pop", "Années 90"], artistes: ["Dr. Alban", "2 Unlimited", "Haddaway", "Mylène Farmer", "TLC"] },
    mix7080:     { titre: "Radio 70's 80's Mix", picto: "lune",     c1: "#e14eea", c2: "#f7cdfa", fond: "#40104a", slogan: "Les nuits rétro de L'Escale.", texte: "Toute la nuit, les plus belles chansons des années 70 et 80 tournent pour les insomniaques, les travailleurs de nuit et les rêveurs. Le phare reste allumé.", genres: ["Années 70 et 80", "Nuit"], artistes: ["Elton John", "Daniel Balavoine", "Tina Turner", "Earth, Wind & Fire", "Indochine"] },
    libre:       { titre: "La libre antenne",    picto: "micro",    c1: "#f2b45a", c2: "#fff0c4", fond: "#3a2608", slogan: "Programme à définir. Les lignes ouvrent bientôt.", texte: "Vous appelez, on écoute, on en parle. Le voisin bruyant, le chef impossible, le moral en berne. La libre antenne de L'Escale du Soir arrive du lundi au jeudi, de 22h00 à 23h00. Le programme exact sera bientôt dévoilé. Restez à l'écoute.", genres: ["Appels des auditeurs", "Libre antenne"], libre: true }
  };

  /* ===== LA GRILLE (heure de Suisse) ===== */
  const SEMAINE = (rock, retro) => [
    ["00:00","06:00","mix7080"], ["06:00","09:00","morning"], ["09:00","12:00","bestpop"], ["12:00","14:00","popmix"],
    ["14:00","16:00","pop2000s"], ["16:00","18:00","dance"], ["18:00","20:00",rock], ["20:00","22:00",retro],
    ["22:00","23:00","libre"], ["23:00","24:00","mix7080"]
  ];
  const GRILLE = {
    1: SEMAINE("rockclassics", "radio7080"),
    2: SEMAINE("rock90", "radio90"),
    3: SEMAINE("rock2000", "radio2000"),
    4: SEMAINE("rockclassics", "mix1990"),
    5: [["00:00","06:00","mix7080"], ["06:00","09:00","morning"], ["09:00","12:00","bestpop"], ["12:00","14:00","popmix"],
        ["14:00","16:00","pop2000s"], ["16:00","18:00","dance"], ["18:00","20:00","rock90"], ["20:00","22:00","radio7080"], ["22:00","24:00","mix1990"]],
    6: [["00:00","06:00","mix7080"], ["06:00","10:00","morning"], ["10:00","13:00","bestpop"], ["13:00","16:00","pop2000s"],
        ["16:00","19:00","rock2000"], ["19:00","22:00","popmix"], ["22:00","24:00","dance"]],
    0: [["00:00","06:00","mix7080"], ["06:00","10:00","morning"], ["10:00","13:00","radio7080"], ["13:00","16:00","rockclassics"],
        ["16:00","19:00","radio90"], ["19:00","22:00","radio2000"], ["22:00","24:00","mix1990"]]
  };
  const JOURS = [[1,"Lundi"],[2,"Mardi"],[3,"Mercredi"],[4,"Jeudi"],[5,"Vendredi"],[6,"Samedi"],[0,"Dimanche"]];
  const NOMS = Object.fromEntries(JOURS);

  /* ===== Heure actuelle en Suisse ===== */
  function maintenantSuisse() {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Zurich", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date()).map(x => [x.type, x.value]));
    const jour = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[p.weekday];
    return { jour, minutes: (+p.hour) * 60 + (+p.minute) };
  }
  const enMinutes = h => { const [a, b] = h.split(":").map(Number); return a * 60 + b; };
  const affiche = h => h === "24:00" ? "00:00" : h;

  function enCours(jour, debut, fin) {
    const n = maintenantSuisse();
    return n.jour === jour && n.minutes >= enMinutes(debut) && n.minutes < enMinutes(fin);
  }

  function carte(jour, [debut, fin, id]) {
    const e = EMISSIONS[id];
    const live = enCours(jour, debut, fin);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "emission" + (e.libre ? " libre" : "") + (live ? " en-cours" : "");
    b.style.setProperty("--c1", e.c1); b.style.setProperty("--c2", e.c2); b.style.setProperty("--fond", e.fond);
    b.innerHTML = `
      <div class="heure">${affiche(debut)}<span>à ${affiche(fin)}</span></div>
      <div class="info"><span class="picto" aria-hidden="true">${PICTOS[e.picto]}</span><div><div class="titre"></div><span class="accroche"></span></div></div>
      <div class="badges">
        ${e.libre ? '<span class="badge">À définir</span>' : ""}
        <span class="plus">Découvrir +</span>
      </div>`;
    b.querySelector(".titre").textContent = e.titre;
    b.querySelector(".accroche").textContent = e.slogan;
    b.addEventListener("click", () => ouvrirFiche(id));
    return b;
  }

  /* ===== Onglets des jours ===== */
  const zoneJours = document.getElementById("jours");
  const liste = document.getElementById("liste");
  let jourChoisi = maintenantSuisse().jour;

  function afficherJour(j) {
    jourChoisi = j;
    zoneJours.querySelectorAll(".jour").forEach(x => {
      const actif = +x.dataset.jour === j;
      x.classList.toggle("actif", actif); x.setAttribute("aria-selected", actif);
    });
    const act = zoneJours.querySelector(".jour.actif");
    if (act) zoneJours.scrollLeft = act.offsetLeft - (zoneJours.clientWidth - act.offsetWidth) / 2;
    liste.innerHTML = "";
    GRILLE[j].forEach(c => liste.appendChild(carte(j, c)));
  }

  const auj = maintenantSuisse().jour;
  JOURS.forEach(([j, nom]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "jour"; b.dataset.jour = j; b.setAttribute("role", "tab");
    b.innerHTML = `${nom.slice(0, 3)}.<small>${j === auj ? "Aujourd'hui" : nom}</small>`;
    b.addEventListener("click", () => afficherJour(j));
    zoneJours.appendChild(b);
  });

  /* ===== En ce moment ===== */
  function majMaintenant() {
    const n = maintenantSuisse();
    const c = GRILLE[n.jour].find(([d, f]) => n.minutes >= enMinutes(d) && n.minutes < enMinutes(f));
    const zone = document.getElementById("carte-maintenant");
    zone.innerHTML = "";
    if (c) { zone.appendChild(carte(n.jour, c)); document.getElementById("maintenant").hidden = false; }
  }

  /* ===== Fiche détaillée ===== */
  const fiche = document.getElementById("fiche");
  function ouvrirFiche(id) {
    const e = EMISSIONS[id];
    fiche.style.setProperty("--c1", e.c1); fiche.style.setProperty("--c2", e.c2); fiche.style.setProperty("--fond", e.fond);
    fiche.classList.toggle("libre", !!e.libre);
    document.getElementById("fiche-picto").innerHTML = PICTOS[e.picto];
    document.getElementById("fiche-titre").textContent = e.titre;
    const ep = document.getElementById("fiche-epoque"); ep.innerHTML = "";
    (e.artistes || []).forEach(n => { const s = document.createElement("span"); s.textContent = n; ep.appendChild(s); });
    document.getElementById("fiche-epoque-bloc").hidden = !(e.artistes && e.artistes.length);
    document.getElementById("fiche-slogan").textContent = e.slogan;
    document.getElementById("fiche-texte").textContent = e.texte;
    const ul = document.getElementById("fiche-creneaux"); ul.innerHTML = "";
    JOURS.forEach(([j, nom]) => GRILLE[j].filter(c => c[2] === id).forEach(([d, f]) => {
      const li = document.createElement("li");
      li.innerHTML = `<b>${nom}</b><span>${affiche(d)} à ${affiche(f)}</span>`;
      ul.appendChild(li);
    }));
    const g = document.getElementById("fiche-genres"); g.innerHTML = "";
    e.genres.forEach(t => { const s = document.createElement("span"); s.className = "badge"; s.textContent = t; g.appendChild(s); });
    document.body.classList.add("fiche-ouverte");
    document.getElementById("fiche-fermer").focus();
  }
  const fermerFiche = () => document.body.classList.remove("fiche-ouverte");
  document.getElementById("fiche-fermer").addEventListener("click", fermerFiche);
  document.getElementById("voile").addEventListener("click", fermerFiche);
  document.addEventListener("keydown", e => { if (e.key === "Escape") fermerFiche(); });

  /* ===== Ciel étoilé ===== */
  const ciel = document.getElementById("ciel");
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("span");
    s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 90 + "%";
    s.style.animationDelay = Math.random() * 4 + "s";
    ciel.appendChild(s);
  }
  document.getElementById("annee").textContent = new Date().getFullYear();

  afficherJour(jourChoisi);
  majMaintenant();
  setInterval(() => { majMaintenant(); afficherJour(jourChoisi); }, 60000);
</script>
</body>
</html>
